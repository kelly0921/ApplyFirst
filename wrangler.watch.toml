name = "applyfirst-watch"
main = "workers/applyfirst-watch-worker.js"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

[vars]
WATCH_RUN_LIMIT = "25"
AUTO_SEND_WATCHED_OPEN_ALERTS = "true"
AUTO_ALERT_EXISTING_OPEN_ON_WATCH = "true"
SMS_PROVIDER = "twilio"
SMS_ALERTS_ENABLED = "false"
DISCOVERY_SEARCH_PROVIDER = "brave"
DISCOVERY_SEARCH_COUNTRY = "US"
DISCOVERY_SEARCH_LIMIT = "5"
DISCOVERY_SEARCH_QUERIES_PER_PROGRAM = "3"
DISCOVERY_SEARCH_RESULTS_PER_QUERY = "5"
AUTO_DISCOVERY_SEARCH_ENABLED = "false"
AUTO_DISCOVERY_SEARCH_LIMIT = "3"
AUTO_DISCOVERY_QUERIES_PER_PROGRAM = "2"
AUTO_DISCOVERY_RESULTS_PER_QUERY = "3"
AUTO_DISCOVERY_SEARCH_DRY_RUN = "false"
PROACTIVE_DELIVERY_ENABLED = "false"
PROACTIVE_DIGEST_WEEKDAY_UTC = "1"
PROACTIVE_DIGEST_HOUR_UTC = "16"
PROACTIVE_DIGEST_MAX_ITEMS = "5"
PROACTIVE_IMMEDIATE_MAX_PER_RUN = "3"

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "applyfirst-watch"
database_id = "5b13abd5-8970-4403-8cb9-2e5634186cd2"
migrations_dir = "cloudflare/d1"

[[d1_databases]]
binding = "CAPTURE_DB"
database_name = "applyfirst_beta"
database_id = "53721b6a-c480-4abb-b470-e0f9703288b8"
migrations_dir = "cloudflare/d1-capture"

[[send_email]]
name = "EMAIL"

[observability]
enabled = true
head_sampling_rate = 1
