name: Resume review evaluation checks
on:
  pull_request:
    paths:
      - 'src/resume-review/**'
      - 'tests/resume-review-fixtures.js'
      - 'tests/resume-opportunity-fixtures.js'
      - 'tests/resume-mentor-context-fixtures.js'
      - 'scripts/test-resume-review.mjs'
      - 'scripts/test-resume-opportunities.mjs'
      - 'scripts/test-resume-mentor-calibration.mjs'
      - 'docs/RESUME_REVIEW_ENGINE.md'
      - 'docs/RESUME_COACH_UX_CONTRACT.md'
      - 'docs/RESUME_MENTOR_CALIBRATION.md'
      - 'docs/RESUME_OPPORTUNITY_REVIEW_CONTRACT.md'
      - 'package.json'
      - '.github/workflows/resume-review-evals.yml'
  push:
    branches: [main]
    paths:
      - 'src/resume-review/**'
      - 'tests/resume-review-fixtures.js'
      - 'tests/resume-opportunity-fixtures.js'
      - 'tests/resume-mentor-context-fixtures.js'
      - 'scripts/test-resume-review.mjs'
      - 'scripts/test-resume-opportunities.mjs'
      - 'scripts/test-resume-mentor-calibration.mjs'
      - 'package.json'
jobs:
  smoke-evals:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run resume:eval
